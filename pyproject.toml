[project]
name = "school_erp"
authors = [{ name = "School ERP", email = "swartdata@gmail.com" }]
description = "School management on ERPNext: students as customers, term billing, fee statements, timetable, transport, lunch, activities, SMS/email, licensed modules"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
