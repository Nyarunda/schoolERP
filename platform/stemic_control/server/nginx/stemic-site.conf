# The body shared by every Stemic server block (included from conf.d/stemic.conf).
# $stemic_site (map in conf.d/stemic-domains.conf) is the site folder: the Host itself, or a school's own domain mapped to it.
root /home/frappe/frappe-bench/sites;
client_max_body_size 50m;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

location /assets {
	try_files $uri =404;
	add_header Cache-Control "max-age=31536000";
}

location ~ ^/protected/(.*) {
	internal;
	try_files /$stemic_site/$1 =404;
}

location /socket.io {
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header X-Frappe-Site-Name $stemic_site;
	proxy_set_header Origin https://$host;
	proxy_set_header Host $host;
	proxy_pass http://stemic_socketio;
}

location / {
	rewrite ^(.+)/$ $1 permanent;
	rewrite ^(.+)/index\.html$ $1 permanent;
	rewrite ^(.+)\.html$ $1 permanent;

	location ~* ^/files/.*\.(htm|html|svg|xml) {
		add_header Content-disposition "attachment";
		try_files /$stemic_site/public$uri @webserver;
	}

	try_files /$stemic_site/public$uri @webserver;
}

location @webserver {
	proxy_http_version 1.1;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Frappe-Site-Name $stemic_site;
	proxy_set_header Host $host;
	proxy_set_header X-Use-X-Accel-Redirect True;
	proxy_read_timeout 120;
	proxy_redirect off;
	proxy_pass http://stemic_frappe;
}

access_log /var/log/nginx/stemic.access.log;
error_log /var/log/nginx/stemic.error.log;
