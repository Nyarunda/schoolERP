name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: Quick checks (no bench)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install pytest cryptography
      - run: bash scripts/check.sh
      - name: Control plane checks (no bench)
        run: |
          python -m compileall -q platform/stemic_control/stemic_control
          PYTHONPATH=platform/stemic_control python -m pytest -q platform/stemic_control/stemic_control/tests/test_billing_integrity_contract.py platform/stemic_control/stemic_control/tests/test_tax_rules.py platform/stemic_control/stemic_control/tests/test_etims_integration_contract.py

  bench-tests:
    name: Integration tests (Frappe + ERPNext v16)
    needs: quick-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libcups2-dev redis-tools xfonts-75dpi xfonts-base
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt-get install -y ./wkhtmltox_0.12.6.1-2.jammy_amd64.deb
      - name: Bench
        run: |
          pip install frappe-bench
          npm install -g yarn
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:13000
          bench get-app --branch version-16 --skip-assets erpnext
          bench get-app --skip-assets "$GITHUB_WORKSPACE/app"
      - name: Site
        run: |
          set -o pipefail
          cd ~/frappe-bench
          # The DB service runs in a container, so the site's DB user must be allowed from any host
          ( bench new-site test.localhost --db-root-password root --admin-password admin \
              --mariadb-user-host-login-scope='%' --install-app erpnext \
            && bench --site test.localhost install-app school_erp \
            && bench --site test.localhost set-config allow_tests true ) 2>&1 | tee ~/site.log
      - name: Run tests
        run: |
          set -o pipefail
          cd ~/frappe-bench
          bench --site test.localhost run-tests --app school_erp 2>&1 | tee ~/tests.log
      - name: Control plane tests (stemic_control on its own admin site)
        run: |
          set -o pipefail
          cd ~/frappe-bench
          # the app lives in this repository under platform/; install it the way a bench would
          ln -s "$GITHUB_WORKSPACE/app/platform/stemic_control" apps/stemic_control
          ./env/bin/pip install -q -e apps/stemic_control
          grep -qx stemic_control sites/apps.txt || printf '\nstemic_control\n' >> sites/apps.txt
          sed -i '/^$/d' sites/apps.txt
          bench new-site admin.localhost --db-root-password root --admin-password admin \
              --mariadb-user-host-login-scope='%' --install-app stemic_control
          bench --site admin.localhost set-config allow_tests true
          bench --site admin.localhost run-tests --app stemic_control 2>&1 | tee -a ~/tests.log
      - name: Stemic's books (the Control Center with ERPNext on its site)
        run: |
          set -o pipefail
          cd ~/frappe-bench
          bench new-site books.localhost --db-root-password root --admin-password admin \
              --mariadb-user-host-login-scope='%' --install-app erpnext --install-app stemic_control
          bench --site books.localhost set-config allow_tests true
          # installed together, Stemic Settings takes ERPNext's install-time currency; the books are in KES
          bench --site books.localhost execute frappe.db.set_single_value --args '["Stemic Settings", "currency", "KES"]'
          bench --site books.localhost execute frappe.db.commit
          bench --site books.localhost run-tests --module stemic_control.tests.test_accounting 2>&1 | tee -a ~/tests.log
      - name: Billing concurrency (two real clients per scenario against MariaDB)
        run: |
          set -o pipefail
          cd ~/frappe-bench/sites
          # exits 1 if a protected scenario is inconsistent or a client crashed/hung, 2 if a control race stopped breaking
          # 1) snapshot isolation OFF (MariaDB 10.x behaviour): the locks must do the work, and the control must break
          STEMIC_RACE_SNAPSHOT_ISOLATION=OFF ../env/bin/python ../apps/stemic_control/scripts/billing_concurrency.py admin.localhost protected control 2>&1 | tee -a ~/tests.log
          # 2) the server's default (ON on MariaDB 11.6+): still consistent
          ../env/bin/python ../apps/stemic_control/scripts/billing_concurrency.py admin.localhost protected 2>&1 | tee -a ~/tests.log
      - name: End-to-end onboarding (register, pay, provision a real site, license, school login)
        run: |
          set -o pipefail
          cd ~/frappe-bench
          # A throwaway vendor key pair for this run only: the real private key never leaves the vendor. Its public
          # half replaces School ERP's in this bench's copy only (nothing is committed).
          ./env/bin/python -c "
          from school_erp.logic.license import generate_keypair
          private, public = generate_keypair()
          open('$RUNNER_TEMP/e2e-vendor.key', 'w').write(private)
          open('apps/school_erp/school_erp/licensing/public_key.py', 'w').write(f'PUBLIC_KEY = \"{public}\"\n')
          "
          bench --site admin.localhost set-config stemic_license_private_key_file "$RUNNER_TEMP/e2e-vendor.key"
          bench --site admin.localhost set-config stemic_local_provisioner 1
          bench --site admin.localhost set-config stemic_db_root_password root
          bench --site admin.localhost set-config stemic_mariadb_user_host_login_scope '%'
          bench --site admin.localhost set-config stemic_provision_environment development
          bench --site admin.localhost set-config -p stemic_provision_allowed_benches "[\"$HOME/frappe-bench\"]"
          cd sites
          ../env/bin/python ../apps/stemic_control/scripts/e2e_onboarding.py admin.localhost 2>&1 | tee -a ~/tests.log
      - name: Backup restores (back up the school test site, restore it into a throwaway site, compare)
        run: |
          set -o pipefail
          cd ~/frappe-bench/sites
          # uses the admin site's database root password, set in the step above
          ../env/bin/python ../apps/stemic_control/scripts/restore_check.py admin.localhost test.localhost 2>&1 | tee -a ~/tests.log
      - name: Show errors as annotations
        if: failure()
        run: |
          # GitHub shows at most 10 annotations per step: send the test failures first, the site log only if tests never ran
          if [ -f ~/tests.log ]; then
            grep -E "✖|FAIL:|ERROR:|Error: |Exception: |AssertionError|tests/test_[a-z_]+\.py\", line" ~/tests.log | tail -n 10 | while IFS= read -r line; do
              echo "::error title=tests::${line//%/%25}"
            done
          elif [ -f ~/site.log ]; then
            tail -n 10 ~/site.log | while IFS= read -r line; do echo "::error title=site::${line//%/%25}"; done
          fi
      - name: Test summary
        if: always()
        run: |
          {
            echo '### Test output (last 80 lines)'
            echo '```'
            if [ -f ~/tests.log ]; then
              tail -n 80 ~/tests.log
            elif [ -f ~/site.log ]; then
              tail -n 80 ~/site.log
            else
              echo 'No test log available; job may have stopped during Bench setup.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
