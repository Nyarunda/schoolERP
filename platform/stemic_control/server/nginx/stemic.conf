# Stemic Schools: the Control Center (admin.stemicschools.com) and every school (<school>.stemicschools.com), one bench.
# Visitors reach Cloudflare, which connects here over TLS with the Cloudflare Origin Certificate (mode: Full (strict)).
# The site is chosen by the Host header, so a newly provisioned school works without changing this file;
# schools' own domains are added by stemic-domains-sync (conf.d/stemic-domains.conf, which also defines $stemic_site).

upstream stemic_frappe { server 127.0.0.1:8000 fail_timeout=0; }
upstream stemic_socketio { server 127.0.0.1:9000 fail_timeout=0; }

include /etc/nginx/snippets/cloudflare-realip.conf;

# Anything that is not one of our names (scanners hitting the bare IP): drop it
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	listen 443 ssl http2 default_server;
	listen [::]:443 ssl http2 default_server;
	ssl_reject_handshake on;
	return 444;
}

server {
	listen 80;
	listen [::]:80;
	server_name stemicschools.com *.stemicschools.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name stemicschools.com *.stemicschools.com;

	ssl_certificate /etc/ssl/cloudflare/stemicschools.pem;
	ssl_certificate_key /etc/ssl/cloudflare/stemicschools.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:stemic_ssl:10m;

	include /etc/nginx/snippets/stemic-site.conf;
}
